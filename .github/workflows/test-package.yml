name: "TESTY | paczka"

on:
  pull_request:
  push:
    branches: [main]

# Tag kontraktu z vulqen/spec (05). Podbicie to świadoma zmiana w tym pliku.
env:
  VULQEN_SPEC_REF: spec-v1.1.0

jobs:
  quality:
    name: "PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Repozytorium serwera jest prywatne: GITHUB_TOKEN tej paczki go nie widzi.
      # VULQEN_SPEC_TOKEN to token z prawem odczytu DeveloperLancer/vulqen.
      - name: Checkout spec ${{ env.VULQEN_SPEC_REF }}
        uses: actions/checkout@v4
        with:
          repository: DeveloperLancer/vulqen
          ref: ${{ env.VULQEN_SPEC_REF }}
          token: ${{ secrets.VULQEN_SPEC_TOKEN }}
          path: .spec/vulqen
          sparse-checkout: spec

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zlib
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Reject path repositories
        run: php bin/guard-no-path-repo

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPUnit
        env:
          VULQEN_SPEC_DIR: ${{ github.workspace }}/.spec/vulqen/spec
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: composer phpstan
